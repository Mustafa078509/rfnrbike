<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RFN Admin Dashboard</title>
<style>
:root{--red:#d81e25;--dark:#15161a;--bg:#f4f5f7;--line:#e2e5e9;--muted:#69707a;--green:#137333}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17191d}.top{background:var(--dark);color:#fff;padding:15px 22px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}.top img{width:88px}.top h1{font-size:20px;flex:1;margin:0}.top button{background:transparent;color:#fff;border:1px solid #555;padding:9px 13px;border-radius:7px;cursor:pointer}.wrap{max-width:1450px;margin:22px auto;padding:0 18px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tab{padding:11px 18px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:700;cursor:pointer}.tab.active{background:var(--dark);color:#fff}.page[hidden]{display:none}.stats{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:12px;margin-bottom:16px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px #0000000a}.stat{padding:16px}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:26px;margin-top:7px}.panel{padding:18px;margin-bottom:16px}.panel h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d2d6dc;border-radius:7px;font:inherit;background:#fff}.field textarea{min-height:70px}.actions{display:flex;gap:8px;align-items:end}.btn{padding:10px 15px;border:0;border-radius:7px;font-weight:700;cursor:pointer}.primary{background:var(--red);color:#fff}.secondary{background:#e8eaee}.toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:10px;border:1px solid #d2d6dc;border-radius:8px}.toolbar input{flex:1;min-width:240px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}th{background:#fafafa}.small{padding:6px 9px;border:1px solid #cfd3d9;border-radius:6px;background:#fff;cursor:pointer}.delete{color:#b42318}.ok{color:var(--green);font-weight:700}.low{color:#b42318;font-weight:700}.notice{margin-top:10px;font-size:13px}.notice.error{color:#b42318}.notice.success{color:var(--green)}.thumb{width:65px;height:45px;object-fit:contain;background:#f6f6f6;border-radius:6px}@media(max-width:900px){.grid,.stats{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.stats{grid-template-columns:1fr}}
</style></head><body>
<header class="top"><img src="/assets/rfn-logo.png" alt="RFN"><h1>Admin Dashboard — Products Table</h1><span id="adminName"></span><button id="logout">Logout</button></header>
<main class="wrap"><div class="tabs"><button class="tab active" data-tab="partsPage">Parts</button><button class="tab" data-tab="bikesPage">Bikes</button></div>
<section id="partsPage" class="page">
<div class="stats"><div class="stat"><span>Total parts</span><strong id="partsCount">0</strong></div><div class="stat"><span>Total units</span><strong id="unitsCount">0</strong></div><div class="stat"><span>Low stock</span><strong id="lowCount">0</strong></div><div class="stat"><span>Retail inventory value</span><strong id="valueCount">$0.00</strong></div></div>
<section class="panel"><h2 id="partFormTitle">Add part</h2><form id="partForm" class="grid"><input type="hidden" id="partId"><div class="field"><label>Bike</label><input id="partBike" required placeholder="RFN SX-E5"></div><div class="field"><label>Part name</label><input id="partName" required></div><div class="field"><label>Part number</label><input id="partNumber" required></div><div class="field"><label>Quantity</label><input id="partQty" type="number" min="0" value="3"></div><div class="field"><label>Dealer price</label><input id="partDealer" type="number" min="0" step="0.01"></div><div class="field"><label>Retail price</label><input id="partRetail" type="number" min="0" step="0.01"></div><div class="field"><label>Low stock threshold</label><input id="partLow" type="number" min="0" value="3"></div><div class="field"><label>Active</label><select id="partActive"><option value="true">Yes</option><option value="false">No</option></select></div><div class="field" style="grid-column:span 3"><label>Description</label><textarea id="partDescription"></textarea></div><div class="actions"><button class="btn primary" id="savePart">Save part</button><button class="btn secondary" type="button" id="cancelPart" hidden>Cancel</button></div></form><div id="partNotice" class="notice"></div></section>
<section class="panel"><h2>Parts from public.products</h2><div class="toolbar"><input id="partSearch" placeholder="Search bike, part name or part number"><select id="bikeFilter"><option value="">All bikes</option></select><button class="btn secondary" id="refreshParts">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Bike</th><th>Name</th><th>Part #</th><th>Qty</th><th>Dealer</th><th>Retail</th><th>Active</th><th>Updated</th><th>Actions</th></tr></thead><tbody id="partRows"></tbody></table></div></section></section>
<section id="bikesPage" class="page" hidden>
<section class="panel"><h2 id="bikeFormTitle">Add bike</h2><form id="bikeForm" class="grid"><input type="hidden" id="bikeId"><div class="field"><label>Bike name</label><input id="bikeName" required></div><div class="field"><label>Model code</label><input id="bikeModel" required></div><div class="field"><label>Quantity</label><input id="bikeQty" type="number" min="0" value="0"></div><div class="field"><label>Dealer price</label><input id="bikeDealer" type="number" min="0" step="0.01"></div><div class="field"><label>Retail price</label><input id="bikeRetail" type="number" min="0" step="0.01"></div><div class="field"><label>Image URL</label><input id="bikeImage"></div><div class="field"><label>Parts catalog URL</label><input id="bikePartsUrl"></div><div class="field"><label>Colors (comma separated)</label><input id="bikeColors"></div><div class="field"><label>Pre-order</label><select id="bikePreorder"><option value="false">No</option><option value="true">Yes</option></select></div><div class="field"><label>Active</label><select id="bikeActive"><option value="true">Yes</option><option value="false">No</option></select></div><div class="field" style="grid-column:span 3"><label>Description</label><textarea id="bikeDescription"></textarea></div><div class="actions"><button class="btn primary" id="saveBike">Save bike</button><button class="btn secondary" type="button" id="cancelBike" hidden>Cancel</button></div></form><div id="bikeNotice" class="notice"></div></section>
<section class="panel"><h2>Bikes from public.products</h2><div class="toolbar"><input id="bikeSearch" placeholder="Search bike or model"><button class="btn secondary" id="refreshBikes">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Image</th><th>Name</th><th>Model</th><th>Qty</th><th>Dealer</th><th>Retail</th><th>Pre-order</th><th>Active</th><th>Actions</th></tr></thead><tbody id="bikeRows"></tbody></table></div></section></section>
</main>
<script type="module">
import { getUser, logout } from '/identity-client.js?v=products-dashboard-1';
const $=s=>document.querySelector(s), money=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD'}), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let products=[];
function session(){try{return JSON.parse(localStorage.getItem('rfnSupabaseSession')||'null')}catch{return null}}
async function api(path,options={}){const s=session();if(!s?.access_token)throw new Error('Please sign in again.');const r=await fetch(path,{...options,headers:{Authorization:`Bearer ${s.access_token}`,'Content-Type':'application/json',...(options.headers||{})}});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.error||d?.message||t||`HTTP ${r.status}`);return d}
function show(id,msg,type=''){const e=$(id);e.textContent=msg;e.className=`notice ${type}`}
async function requireLogin(){const u=await getUser();if(!u){location.replace('/adminv2/login.html?returnTo=/adminv2/dashboard.html');return false}$('#adminName').textContent=u.user_metadata?.full_name||u.email||'';return true}
async function load(){const d=await api('/api/products');products=d.products||[];renderParts();renderBikes();fillBikeFilter()}
const parts=()=>products.filter(p=>String(p.product_type||'part').toLowerCase()==='part'); const bikes=()=>products.filter(p=>String(p.product_type||'').toLowerCase()==='bike');
function fillBikeFilter(){const cur=$('#bikeFilter').value;const names=[...new Set(parts().map(p=>p.bike).filter(Boolean))].sort();$('#bikeFilter').innerHTML='<option value="">All bikes</option>'+names.map(n=>`<option>${esc(n)}</option>`).join('');$('#bikeFilter').value=names.includes(cur)?cur:''}
function renderParts(){const q=$('#partSearch').value.trim().toLowerCase(),bf=$('#bikeFilter').value;const list=parts().filter(p=>(!bf||p.bike===bf)&&`${p.bike} ${p.name} ${p.part_number}`.toLowerCase().includes(q));$('#partRows').innerHTML=list.map(p=>`<tr><td>${esc(p.bike||'—')}</td><td>${esc(p.name)}</td><td>${esc(p.part_number)}</td><td class="${Number(p.stock_quantity)<=Number(p.low_stock_threshold||3)?'low':'ok'}">${Number(p.stock_quantity||0)}</td><td>${money(p.dealer_price)}</td><td>${money(p.retail_price)}</td><td>${p.active!==false?'Yes':'No'}</td><td>${p.updated_at?new Date(p.updated_at).toLocaleDateString():'—'}</td><td><button class="small" data-part-edit="${p.id}">Edit</button> <button class="small delete" data-part-delete="${p.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="9">No parts found.</td></tr>';$('#partsCount').textContent=parts().length;$('#unitsCount').textContent=parts().reduce((a,p)=>a+Number(p.stock_quantity||0),0);$('#lowCount').textContent=parts().filter(p=>Number(p.stock_quantity||0)<=Number(p.low_stock_threshold||3)).length;$('#valueCount').textContent=money(parts().reduce((a,p)=>a+Number(p.stock_quantity||0)*Number(p.retail_price||0),0))}
function resetPart(){$('#partForm').reset();$('#partId').value='';$('#partQty').value=3;$('#partLow').value=3;$('#partActive').value='true';$('#partFormTitle').textContent='Add part';$('#savePart').textContent='Save part';$('#cancelPart').hidden=true}
$('#partForm').onsubmit=async e=>{e.preventDefault();const id=$('#partId').value;const body={name:$('#partName').value.trim(),part_number:$('#partNumber').value.trim(),bike:$('#partBike').value.trim(),product_type:'part',dealer_price:Number($('#partDealer').value||0),retail_price:Number($('#partRetail').value||0),stock_quantity:Number($('#partQty').value||0),low_stock_threshold:Number($('#partLow').value||3),active:$('#partActive').value==='true',description:$('#partDescription').value.trim()};try{await api(id?`/api/products/${id}`:'/api/products',{method:id?'PATCH':'POST',body:JSON.stringify(body)});show('#partNotice',id?'Part updated.':'Part added.','success');resetPart();await load()}catch(err){show('#partNotice',err.message,'error')}};
$('#partRows').onclick=async e=>{const id=e.target.dataset.partEdit,del=e.target.dataset.partDelete;if(id){const p=products.find(x=>x.id===id);$('#partId').value=p.id;$('#partBike').value=p.bike||'';$('#partName').value=p.name||'';$('#partNumber').value=p.part_number||'';$('#partQty').value=p.stock_quantity||0;$('#partDealer').value=p.dealer_price||0;$('#partRetail').value=p.retail_price||0;$('#partLow').value=p.low_stock_threshold??3;$('#partActive').value=String(p.active!==false);$('#partDescription').value=p.description||'';$('#partFormTitle').textContent='Edit part';$('#savePart').textContent='Update part';$('#cancelPart').hidden=false;scrollTo({top:180,behavior:'smooth'})}if(del&&confirm('Delete this part?')){try{await api(`/api/products/${del}`,{method:'DELETE'});await load()}catch(err){show('#partNotice',err.message,'error')}}};
function renderBikes(){const q=$('#bikeSearch').value.trim().toLowerCase();const list=bikes().filter(p=>`${p.name} ${p.part_number}`.toLowerCase().includes(q));$('#bikeRows').innerHTML=list.map(p=>`<tr><td>${p.image_url?`<img class="thumb" src="${esc(p.image_url)}">`:'—'}</td><td>${esc(p.name)}</td><td>${esc(p.part_number)}</td><td><input data-bike-qty="${p.id}" type="number" min="0" step="1" value="${Number(p.stock_quantity||0)}" style="width:78px;padding:7px;border:1px solid #cfd3d9;border-radius:6px"></td><td><input data-bike-dealer="${p.id}" type="number" min="0" step="0.01" value="${Number(p.dealer_price||0).toFixed(2)}" style="width:105px;padding:7px;border:1px solid #cfd3d9;border-radius:6px"></td><td><input data-bike-retail="${p.id}" type="number" min="0" step="0.01" value="${Number(p.retail_price||0).toFixed(2)}" style="width:105px;padding:7px;border:1px solid #cfd3d9;border-radius:6px"></td><td>${p.preorder?'Yes':'No'}</td><td>${p.active!==false?'Yes':'No'}</td><td><button class="small" data-bike-save="${p.id}" style="font-weight:700">Save</button> <button class="small" data-bike-edit="${p.id}">Edit</button> <button class="small delete" data-bike-delete="${p.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="9">No bikes found.</td></tr>'}
function resetBike(){$('#bikeForm').reset();$('#bikeId').value='';$('#bikeActive').value='true';$('#bikePreorder').value='false';$('#bikeFormTitle').textContent='Add bike';$('#saveBike').textContent='Save bike';$('#cancelBike').hidden=true}
$('#bikeForm').onsubmit=async e=>{e.preventDefault();const id=$('#bikeId').value;const name=$('#bikeName').value.trim();const body={name,part_number:$('#bikeModel').value.trim(),bike:name,product_type:'bike',dealer_price:Number($('#bikeDealer').value||0),retail_price:Number($('#bikeRetail').value||0),stock_quantity:Number($('#bikeQty').value||0),low_stock_threshold:0,active:$('#bikeActive').value==='true',image_url:$('#bikeImage').value.trim(),parts_url:$('#bikePartsUrl').value.trim(),description:$('#bikeDescription').value.trim(),colors:$('#bikeColors').value.split(',').map(x=>x.trim()).filter(Boolean),preorder:$('#bikePreorder').value==='true'};try{await api(id?`/api/products/${id}`:'/api/products',{method:id?'PATCH':'POST',body:JSON.stringify(body)});show('#bikeNotice',id?'Bike updated.':'Bike added.','success');resetBike();await load()}catch(err){show('#bikeNotice',err.message,'error')}};
$('#bikeRows').onclick=async e=>{const id=e.target.dataset.bikeEdit,save=e.target.dataset.bikeSave,del=e.target.dataset.bikeDelete;if(save){const dealerEl=document.querySelector(`[data-bike-dealer="${save}"]`),retailEl=document.querySelector(`[data-bike-retail="${save}"]`),qtyEl=document.querySelector(`[data-bike-qty="${save}"]`);const body={product_type:'bike',dealer_price:Number(dealerEl?.value||0),retail_price:Number(retailEl?.value||0),stock_quantity:Math.max(0,Math.trunc(Number(qtyEl?.value||0)))};try{await api(`/api/products/${save}`,{method:'PATCH',body:JSON.stringify(body)});show('#bikeNotice','Bike price and stock updated.','success');await load()}catch(err){show('#bikeNotice',err.message,'error')}return}if(id){const p=products.find(x=>x.id===id);$('#bikeId').value=p.id;$('#bikeName').value=p.name||'';$('#bikeModel').value=p.part_number||'';$('#bikeQty').value=p.stock_quantity||0;$('#bikeDealer').value=p.dealer_price||0;$('#bikeRetail').value=p.retail_price||0;$('#bikeImage').value=p.image_url||'';$('#bikePartsUrl').value=p.parts_url||'';$('#bikeColors').value=(p.colors||[]).join(', ');$('#bikePreorder').value=String(!!p.preorder);$('#bikeActive').value=String(p.active!==false);$('#bikeDescription').value=p.description||'';$('#bikeFormTitle').textContent='Edit bike';$('#saveBike').textContent='Update bike';$('#cancelBike').hidden=false;scrollTo({top:150,behavior:'smooth'})}if(del&&confirm('Delete this bike?')){try{await api(`/api/products/${del}`,{method:'DELETE'});await load()}catch(err){show('#bikeNotice',err.message,'error')}}};
$('.tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.page').forEach(x=>x.hidden=x.id!==b.dataset.tab)};$('#partSearch').oninput=renderParts;$('#bikeFilter').onchange=renderParts;$('#refreshParts').onclick=load;$('#cancelPart').onclick=resetPart;$('#bikeSearch').oninput=renderBikes;$('#refreshBikes').onclick=load;$('#cancelBike').onclick=resetBike;$('#logout').onclick=async()=>{await logout();location.replace('/adminv2/login.html')};if(await requireLogin())await load();
</script></body></html>
