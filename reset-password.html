<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — RFN USA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-visual" aria-label="RFN password reset">
      <a class="auth-logo" href="/login.html"><img src="/assets/rfn-logo.png" alt="RFN USA"></a>
      <div class="auth-intro"><p class="auth-kicker">Secure Account</p><h1>Create a new password.</h1><p>This link can be used only with a valid Supabase recovery session.</p></div>
    </section>
    <section class="auth-panel">
      <div class="auth-card">
        <h2>New Password</h2>
        <p class="auth-description">Enter and confirm your new password.</p>
        <form id="reset-form" novalidate>
          <div class="field"><label for="password">New password</label><input type="password" id="password" minlength="8" autocomplete="new-password" required></div>
          <div class="field"><label for="confirm-password">Confirm password</label><input type="password" id="confirm-password" minlength="8" autocomplete="new-password" required></div>
          <p class="password-note">Use at least 8 characters.</p>
          <button class="primary-button" id="submit-button" type="submit" disabled>Save new password</button>
          <div id="status" class="status" role="alert" aria-live="polite"></div>
        </form>
        <p class="auth-switch"><a href="/login.html">Return to login</a></p>
      </div>
    </section>
  </main>
  <script type="module">
    import { AuthError, getUser, handleAuthCallback, logout, updatePassword } from './identity-client.js';
    const form=document.querySelector('#reset-form'), button=document.querySelector('#submit-button'), status=document.querySelector('#status');
    function showStatus(message,type='error'){status.textContent=message;status.className=`status ${type}`;}
    try {
      const params=new URLSearchParams(location.search);
      const errorDescription=params.get('error_description');
      if(errorDescription) throw new Error(errorDescription);
      const callback=await handleAuthCallback();
      const user=callback?.user || await getUser();
      if(!user) throw new Error('This reset link is invalid or expired. Request a new link.');
      button.disabled=false;
    } catch(error){showStatus(error.message || 'This reset link is invalid or expired.');}
    form.addEventListener('submit',async(event)=>{
      event.preventDefault();
      const password=document.querySelector('#password').value;
      const confirm=document.querySelector('#confirm-password').value;
      if(password.length<8)return showStatus('Password must contain at least 8 characters.');
      if(password!==confirm)return showStatus('The passwords do not match.');
      button.disabled=true;button.textContent='Saving…';status.className='status';
      try{await updatePassword(password);showStatus('Password updated. Redirecting to login…','success');await logout();setTimeout(()=>location.replace('/login.html?passwordUpdated=1'),900);}
      catch(error){showStatus(error instanceof AuthError?error.message:'Unable to update password.');button.disabled=false;button.textContent='Save new password';}
    });
  </script>
</body>
</html>
