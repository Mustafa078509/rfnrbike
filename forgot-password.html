<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — RFN USA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-visual" aria-label="RFN password recovery">
      <a class="auth-logo" href="/login.html"><img src="/assets/rfn-logo.png" alt="RFN USA"></a>
      <div class="auth-intro">
        <p class="auth-kicker">Account Recovery</p>
        <h1>Reset your password.</h1>
        <p>Enter your dealer email and RFN will send a secure password reset link.</p>
      </div>
    </section>
    <section class="auth-panel">
      <div class="auth-card">
        <h2>Forgot Password</h2>
        <p class="auth-description">Enter the email used for your dealer account.</p>
        <form id="forgot-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" placeholder="dealer@company.com" required>
          </div>
          <button class="primary-button" id="submit-button" type="submit">Send reset link</button>
          <div id="status" class="status" role="alert" aria-live="polite"></div>
        </form>
        <p class="auth-switch"><a href="/login.html">Return to login</a></p>
      </div>
    </section>
  </main>
  <script>
    const form = document.querySelector('#forgot-form');
    const button = document.querySelector('#submit-button');
    const status = document.querySelector('#status');
    function showStatus(message, type='error') { status.textContent=message; status.className=`status ${type}`; }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.querySelector('#email').value.trim().toLowerCase();
      if (!email) return showStatus('Enter your dealer account email.');
      button.disabled=true; button.textContent='Sending…'; status.className='status';
      try {
        const response = await fetch('/.netlify/functions/send-reset-link', {
          method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email})
        });
        let payload={}; try { payload=await response.json(); } catch {}
        if (!response.ok) throw new Error(payload.error || 'Unable to send reset link.');
        showStatus('If this email belongs to a dealer account, a reset link has been sent. Check inbox and spam.', 'success');
        form.reset();
      } catch (error) { showStatus(error.message || 'Unable to send reset link.'); }
      finally { button.disabled=false; button.textContent='Send reset link'; }
    });
  </script>
</body>
</html>
