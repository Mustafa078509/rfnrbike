<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Orders — RFN USA</title>
  <style>html{visibility:hidden}</style>
  <script type="module" src="/auth-guard.js"></script>
  <link rel="stylesheet" href="/admin/admin.css">
  <style>
    header nav{align-items:center;flex-wrap:wrap}
    header nav a.active{color:#d81e25}
    .dealer-name{margin:0 0 20px;color:#6b7280}
    .status-badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#f0f1f3;font-size:12px;font-weight:700}
    .empty{padding:34px;text-align:center;color:#6b7280}
    @media(max-width:800px){header{height:auto;min-height:72px;padding-top:14px;padding-bottom:14px}header nav{gap:10px;font-size:13px}}
  </style>
</head>
<body>
<header>
  <a href="/"><img src="/assets/rfn-logo.png" alt="RFN USA"></a>
  <nav>
    <a href="/">Home</a>
    <a href="/cart.html">Cart</a>
    <a class="active" href="/my-orders.html">My Orders</a>
    <a href="#" onclick="window.rfnLogout();return false;">Logout</a>
  </nav>
</header>
<main>
  <h1>My Orders</h1>
  <p class="dealer-name" id="dealerText">Orders placed from your RFN dealer account.</p>
  <div class="toolbar">
    <input id="q" placeholder="Search order or item">
    <select id="filter">
      <option value="">All statuses</option>
      <option>New</option><option>Processing</option><option>Completed</option><option>Cancelled</option>
    </select>
    <button class="btn dark" id="refreshBtn">Refresh</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Order</th><th>Shipping / Contact</th><th>Items</th><th>Total</th><th>Status</th></tr></thead>
      <tbody id="body"><tr><td colspan="5" class="empty">Loading your orders…</td></tr></tbody>
    </table>
  </div>
</main>
<script type="module">
import { getAccessToken, getProfile } from '/identity-client.js';

let orders = [];
const bodyEl = document.getElementById('body');
const qEl = document.getElementById('q');
const filterEl = document.getElementById('filter');

function esc(value){return String(value ?? '').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'})[ch]);}
function money(value){return '$'+Number(value||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}

async function api(path){
  const token = await getAccessToken();
  if(!token){ location.replace('/login.html?returnTo='+encodeURIComponent('/my-orders.html')); throw new Error('Login required.'); }
  const res = await fetch(path,{headers:{Authorization:`Bearer ${token}`},cache:'no-store'});
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function render(){
  const search=qEl.value.trim().toLowerCase();
  const status=filterEl.value;
  const filtered=orders.filter(o=>(!status||o.status===status)&&(!search||JSON.stringify(o).toLowerCase().includes(search)));
  if(!filtered.length){bodyEl.innerHTML='<tr><td colspan="5" class="empty">No orders found for this account.</td></tr>';return;}
  bodyEl.innerHTML=filtered.map(o=>{
    const items=(o.items||[]).map(i=>`${Number(i.qty??i.quantity??1)}× ${esc(i.name||'RFN Item')}<br><small>${esc(i.code||i.part_number||'')}</small>`).join('<hr>');
    const created=o.created_at||o.createdAt;
    return `<tr>
      <td><b>${esc(o.order_number||o.id)}</b><br><small>${created?new Date(created).toLocaleString():''}</small></td>
      <td>${esc(o.first_name||o.customer?.firstName||'')} ${esc(o.last_name||o.customer?.lastName||'')}<br><small>${esc(o.email||o.customer?.email||'')}<br>${esc(o.phone||o.customer?.phone||'')}</small></td>
      <td>${items}</td>
      <td><b>${money(o.total)}</b></td>
      <td><span class="status-badge">${esc(o.status||'New')}</span></td>
    </tr>`;
  }).join('');
}

async function load(){
  const result=await api('/api/orders');
  orders=Array.isArray(result.orders)?result.orders:[];
  render();
}

try{
  const profile=await getProfile().catch(()=>null);
  if(profile?.dealer_name) document.getElementById('dealerText').textContent=`${profile.dealer_name} — orders placed from this dealer account.`;
  await load();
}catch(err){bodyEl.innerHTML=`<tr><td colspan="5" class="empty">${esc(err.message)}</td></tr>`;}

document.getElementById('refreshBtn').addEventListener('click',()=>load().catch(err=>alert(err.message)));
qEl.addEventListener('input',render);
filterEl.addEventListener('change',render);
</script>
</body>
</html>
