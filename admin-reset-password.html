<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Dealer Password — RFN USA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-visual" aria-label="RFN administrator password reset">
      <a class="auth-logo" href="/index.html"><img src="/assets/rfn-logo.png" alt="RFN USA"></a>
      <div class="auth-intro">
        <p class="auth-kicker">Administrator Tool</p>
        <h1>Reset dealer access.</h1>
        <p>Only an authenticated administrator can assign a new temporary password to a dealer account.</p>
      </div>
    </section>

    <section class="auth-panel">
      <div class="auth-card">
        <h2>Reset password</h2>
        <p class="auth-description">Enter the dealer email and a new temporary password.</p>

        <form id="reset-form" novalidate>
          <div class="field">
            <label for="email">Dealer email</label>
            <input type="email" id="email" autocomplete="email" placeholder="dealer@company.com" required>
          </div>

          <div class="field">
            <label for="password">New temporary password</label>
            <input type="password" id="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
          </div>

          <div class="field">
            <label for="confirm-password">Confirm password</label>
            <input type="password" id="confirm-password" autocomplete="new-password" minlength="8" placeholder="Repeat the password" required>
          </div>

          <button class="primary-button" id="submit-button" type="submit">Reset dealer password</button>
          <div id="status" class="status" role="alert" aria-live="polite"></div>
        </form>

        <p class="auth-switch"><a href="/index.html">Return to dashboard</a></p>
      </div>
    </section>
  </main>

  <script type="module">
    import { getAccessToken, getUser } from './identity-client.js';

    const form = document.querySelector('#reset-form');
    const button = document.querySelector('#submit-button');
    const status = document.querySelector('#status');

    function showStatus(message, type = 'error') {
      status.textContent = message;
      status.className = `status ${type}`;
    }

    const user = await getUser();
    if (!user) {
      const returnTo = encodeURIComponent('/admin-reset-password.html');
      window.location.replace(`/login.html?returnTo=${returnTo}`);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const email = document.querySelector('#email').value.trim().toLowerCase();
      const password = document.querySelector('#password').value;
      const confirmPassword = document.querySelector('#confirm-password').value;

      if (!email || !password || !confirmPassword) {
        showStatus('Complete all fields.');
        return;
      }
      if (password.length < 8) {
        showStatus('Password must contain at least 8 characters.');
        return;
      }
      if (password !== confirmPassword) {
        showStatus('The passwords do not match.');
        return;
      }

      button.disabled = true;
      button.textContent = 'Resetting…';
      status.className = 'status';

      try {
        const accessToken = await getAccessToken();
        if (!accessToken) throw new Error('Your login session has expired.');

        const response = await fetch('/.netlify/functions/admin-reset-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${accessToken}`
          },
          body: JSON.stringify({ email, password })
        });

        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || 'Unable to reset the password.');

        showStatus('Password updated successfully. Give the temporary password to the dealer securely.', 'success');
        form.reset();
      } catch (error) {
        showStatus(error.message || 'Unable to reset the password.');
      } finally {
        button.disabled = false;
        button.textContent = 'Reset dealer password';
      }
    });
  </script>
</body>
</html>
